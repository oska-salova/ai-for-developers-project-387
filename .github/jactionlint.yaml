# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json

ignores:
  # hexlet-check.yml is generated by Hexlet and marked "DO NOT DELETE OR EDIT",
  # so its checkout step cannot be changed here. Revisit when Hexlet regenerates it.
  - file: ".github/workflows/hexlet-check.yml"
    rule: artipacked
    reason: "Upstream-generated workflow, not editable in this repository"
    expires: "2027-01-31"
  # opencode.yml is started by a comment, which the dangerous-triggers rule reports
  # unconditionally. Only the repository owner can start the job, GITHUB_TOKEN stays
  # read-only, and the checkout never runs code from a pull request.
  - file: ".github/workflows/opencode.yml"
    rule: dangerous-triggers
    reason: "Comment-triggered agent; the job requires author_association == OWNER"
    expires: "2027-06-30"
  # The reviewer installs a pinned CLI in its own job. Adding a 214 MB platform
  # binary to mise.toml for every developer is worse: npm verifies the registry
  # tarball and the version is exact.
  - file: ".github/workflows/opencode-review.yml"
    rule: adhoc-packages
    reason: "opencode CLI pinned to 1.19.5; npm verifies the tarball"
    expires: "2027-06-30"
