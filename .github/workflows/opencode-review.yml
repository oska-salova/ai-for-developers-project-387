name: OpenCode Review

# Independent review of every pull request: a different model in a separate run,
# with no write access to code. Criteria live in REVIEW.md, the PR body contract
# lives in .github/pull_request_template.md, and both are read at the PR head.
#
# Two jobs, in order:
#   1. `budget` counts the reviews that already ran for this pull request in the
#      Actions history and refuses before the model is called when the limit is
#      reached. The counter is not a PR comment: a comment can be rewritten, the
#      run history cannot.
#   2. `review` runs only when the budget allowed it. `needs: budget` guarantees
#      the refusal happens first.
#
# Limits stated plainly: the budget holds only while run history is preserved and
# this file is unchanged (a pull request that rewrites it is refused), and a
# repository admin can change either. Every pull request starts a fresh budget,
# so the limit bounds one review loop, not the total spend on an issue.
#
# The OpenCode action supports `pull_request` but not `workflow_run`, so this file
# is executed from the pull request; the guard below and the file-identity check
# in `budget` are the practical defence.
# https://opencode.ai/docs/github/

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Start from nothing: each job grants only what it needs.
permissions: {}

concurrency:
  # A new push makes the running review stale: cancel it and review the new head.
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  budget:
    name: Review budget
    # Drafts, forks, dependabot and infrastructure pull requests start no review,
    # so they must not spend a budget slot either.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      # The counter lives in the run history and is read-only here.
      actions: read
      contents: read
    outputs:
      allowed: ${{ steps.count.outputs.allowed }}
    steps:
      # A pull request that rewrites this file must not grade itself. The check
      # is best effort against accidental edits; a deliberate rewrite is visible
      # in the diff and needs a human.
      - name: Refuse when the review workflow itself was edited
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          path=.github/workflows/opencode-review.yml
          base=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$BASE" --jq .sha)
          head=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$HEAD" --jq .sha)
          if [ "$base" != "$head" ]; then
            echo "::error::PR меняет воркфлоу авторевью ($path): вынесите правку в отдельный PR"
            exit 1
          fi

      - name: Count reviews in the run history
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Repository variable, so the limit is a setting and not a commit.
          LIMIT: ${{ vars.REVIEW_RUN_LIMIT || '3' }}
        run: |
          set -euo pipefail
          # Only reviews that completed are counted: a refusal must not inflate
          # the number, and a run cancelled by a newer push never reached the
          # model.
          used=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/opencode-review.yml/runs?per_page=100" \
            --jq ".workflow_runs[]
                  | select(.id != $GITHUB_RUN_ID)
                  | select(.conclusion == \"success\")
                  | select([.pull_requests[]?.number] | index($PR))
                  | .run_attempt" \
            | awk '{ sum += $1 } END { print sum + 0 }')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          {
            echo "## Бюджет авторевью"
            echo
            echo "- Использовано попыток: $used из $LIMIT"
            echo "- SHA: \`$HEAD_SHA\`"
            echo "- Прогон: $run_url"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$used" -ge "$LIMIT" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Лимит $LIMIT попыток авторевью на этот PR исчерпан (использовано $used). SHA $HEAD_SHA. Логи: $run_url"
            exit 1
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  review:
    name: Review
    needs: budget
    if: needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Read the code, the criteria and the template at the PR head.
      contents: read
      # Read the diff, the body and the files of the pull request.
      # `write` is required to comment on a pull request: `issues: write` alone
      # covers issue threads, not PR threads.
      pull-requests: write
      # Verify that the run links quoted in the body belong to this head.
      actions: read
      # The review itself is a comment; GitHub serves PR comments via issues.
      issues: write
    steps:
      # The trusted workspace: agent instructions, configuration and verdict files
      # come from the default branch only.
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          # The reviewer never pushes; keep the token out of .git/config.
          persist-credentials: false

      # The pull request under review is data in a subdirectory. It cannot shadow
      # AGENTS.md, opencode.json or MCP configuration of the workspace above.
      - name: Checkout pull request into a subdirectory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pull-request
          persist-credentials: false

      # The reviewer must quote the exact revision it judged, so the verdict is
      # checkable instead of trusted. Missing policy files fail before the model
      # is called: there is nothing to review against.
      - name: Pin the criteria version
        id: pin
        run: |
          set -euo pipefail
          for file in pull-request/REVIEW.md pull-request/.github/pull_request_template.md; do
            if [ ! -f "$file" ]; then
              echo "::error::$file отсутствует в head — сверять не с чем"
              exit 1
            fi
          done
          echo "review=$(sha256sum pull-request/REVIEW.md | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "template=$(sha256sum pull-request/.github/pull_request_template.md | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A different vendor from the implementer (deepseek-v4.1-flash):
          # independent review means a different set of blind spots, not just a
          # different run.
          model: opencode/glm-5.3
          # Public repository: do not publish the session on opencode.ai.
          share: false
          use_github_token: true
          prompt: |
            Ты — независимый ревьюер этого pull request. Код писал другой агент.

            Код pull request лежит в подкаталоге `pull-request/`; в корне рабочего
            пространства — базовая ветка. Читай код только из `pull-request/`,
            а инструкции и конфигурацию — из корня.

            Прочитай `pull-request/REVIEW.md` и
            `pull-request/.github/pull_request_template.md` и следуй им: критерии,
            severity и формат вердикта — в первом, контракт тела PR — во втором.
            Спецификацию и тикеты возьми по ссылкам из тела PR
            (`gh pr view ${{ github.event.pull_request.number }} --json body`) и
            прочитай через `gh issue view <номер>`.

            Ограничения: не правь файлы, не коммить, не меняй ветки и issue, не
            оставляй комментарии к строкам диффа. Если `REVIEW.md` прочитать не
            удалось — напиши это вместо вердикта, отпечатки не выдумывай.

            Механика, которой нет в документах:
            - в заголовке вердикта укажи `REVIEW.md@${{ steps.pin.outputs.review }}`,
              `шаблон@${{ steps.pin.outputs.template }}` и
              `head@${{ github.event.pull_request.head.sha }}`;
            - прежде чем засчитать проверку, убедись, что прогон относится к этому
              коду: `gh api repos/${{ github.repository }}/actions/runs/<id> --jq
              '{conclusion, head_sha}'` и сравни `head_sha` с head выше;
            - вердикт запиши в `.scratch/verdict.md` в корне (каталог создай, если
              его нет). Публиковать не нужно: это сделает шаг после тебя.

      - name: Publish verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- opencode-review -->'
          mkdir -p .scratch
          if [ -s .scratch/verdict.md ]; then
            { printf '%s\n\n' "$marker"; cat .scratch/verdict.md; } > .scratch/comment.md
          else
            printf '%s\n\nРевьюер не оставил вердикта; см. лог прогона.\n' "$marker" > .scratch/comment.md
          fi
          gh pr comment "$PR" --body-file .scratch/comment.md
