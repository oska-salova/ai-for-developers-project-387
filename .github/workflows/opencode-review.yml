name: OpenCode Review

# Independent review of every pull request: a different model in a separate run,
# with no write access to code. Criteria live in REVIEW.md, the PR body contract
# lives in .github/pull_request_template.md, and both are read at the PR head, so
# a pull request that sharpens the criteria is reviewed by the criteria it ships.
# https://opencode.ai/docs/github/

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Start from nothing: the job grants only what it needs.
permissions: {}

concurrency:
  # A new push makes the running review stale: cancel it and review the new head.
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Drafts have no claims to verify yet. Fork pull requests are out of scope:
    # the reviewer spends the API key, and the key belongs to this repository.
    # The label is the escape hatch for infrastructure work: a workflow change
    # cannot be reviewed by the workflow it rewrites.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Read the code, the criteria and the template at the PR head.
      contents: read
      # Read the diff, the body and the files of the pull request.
      pull-requests: read
      # Verify that the run links quoted in the body belong to this head.
      actions: read
      # The review itself is a comment; GitHub serves PR comments via issues.
      issues: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The verdict compares the branch against its base.
          fetch-depth: 0
          # The reviewer never pushes; keep the token out of .git/config.
          persist-credentials: false

      # The reviewer must quote the exact revision it judged, so the verdict is
      # checkable instead of trusted. Missing policy files fail before the model
      # is called: there is nothing to review against.
      - name: Pin the criteria version
        run: |
          set -euo pipefail
          for file in REVIEW.md .github/pull_request_template.md; do
            if [ ! -f "$file" ]; then
              echo "::error::$file отсутствует в head — сверять не с чем"
              exit 1
            fi
          done
          {
            echo "REVIEW_SHA=$(sha256sum REVIEW.md | cut -c1-12)"
            echo "TEMPLATE_SHA=$(sha256sum .github/pull_request_template.md | cut -c1-12)"
          } >> "$GITHUB_ENV"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A different vendor from the implementer (deepseek-v4.1-flash):
          # independent review means a different set of blind spots, not just a
          # different run.
          model: opencode/glm-5.3
          # Public repository: do not publish the session on opencode.ai.
          share: false
          use_github_token: true
          prompt: |
            Ты — независимый ревьюер этого pull request. Код писал другой агент.

            Прочитай в текущей ветке `REVIEW.md` и `.github/pull_request_template.md`
            и следуй им: критерии, severity и формат вердикта — в первом, контракт
            тела PR — во втором. Спецификацию и тикеты возьми по ссылкам из тела PR
            (`gh pr view ${{ github.event.pull_request.number }} --json body`) и прочитай
            через `gh issue view <номер>`.

            Ограничения: не правь файлы, не коммить, не меняй ветки и issue, не
            оставляй комментарии к строкам диффа. Если `REVIEW.md` прочитать не
            удалось — напиши это вместо вердикта, отпечатки не выдумывай.

            Механика, которой нет в документах:
            - в заголовке вердикта укажи `REVIEW.md@<хеш>`, `шаблон@<хеш>` и
              `head@${{ github.event.pull_request.head.sha }}`; хеши возьми командами
              `echo "$REVIEW_SHA"` и `echo "$TEMPLATE_SHA"`, не подставляй выражения
              вида env.* — они здесь пустые;
            - прежде чем засчитать проверку, убедись, что прогон относится к этому
              коду: `gh api repos/${{ github.repository }}/actions/runs/<id> --jq
              '{conclusion, head_sha}'` и сравни `head_sha` с head выше;
            - вердикт запиши в `.scratch/verdict.md` (каталог создай, если его нет).
              Публиковать не нужно: это сделает шаг после тебя.

      - name: Publish verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- opencode-review -->'
          mkdir -p .scratch
          if [ -s .scratch/verdict.md ]; then
            { printf '%s\n\n' "$marker"; cat .scratch/verdict.md; } > .scratch/comment.md
          else
            printf '%s\n\nРевьюер не оставил вердикта; см. лог прогона.\n' "$marker" > .scratch/comment.md
          fi
          gh pr comment "$PR" --body-file .scratch/comment.md
