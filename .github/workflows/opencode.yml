name: OpenCode

# Run the agent from a comment: `/oc <task>` or `/opencode <task>`.
# A comment naming an issue-tracker skill (`/oc запусти скил to-spec`)
# runs it with issues: write; a comment naming `implement-spec` gets its own
# long-running job. All other tasks keep the read-only GITHUB_TOKEN.
# https://opencode.ai/docs/github/

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Start from nothing: the job grants only what the agent needs.
permissions: {}

concurrency:
  # One agent per issue or pull request. New instructions must not cancel a run
  # that is already pushing commits.
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    name: Route
    if: |
      github.event.comment.author_association == 'OWNER' &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skill: ${{ steps.parse.outputs.skill }}
    steps:
      - name: Parse skill
        id: parse
        env:
          BODY: ${{ github.event.comment.body }}
          IS_ISSUE: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request == null }}
        run: |
          skill=""
          if [ "$IS_ISSUE" = "true" ]; then
            skill=$(printf '%s\n' "$BODY" \
              | grep -oiE '(скил[^[:space:]]*|skill)[[:space:]]*:?[[:space:]]*@?(to-spec|to-tickets|triage|implement-spec)|/(oc|opencode)[[:space:]]+@?(to-spec|to-tickets|triage|implement-spec)' \
              | head -n1 \
              | grep -oiE '(to-spec|to-tickets|triage|implement-spec)' \
              | tr '[:upper:]' '[:lower:]')
          fi
          echo "skill=$skill" >> "$GITHUB_OUTPUT"

  opencode:
    name: Agent
    needs: route
    # The repository is public. Without the owner check anybody could spend the
    # API key and drive the agent with a prompt-injected comment.
    if: |
      needs.route.outputs.skill == '' &&
      github.event.comment.author_association == 'OWNER' &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    # Infra work means writing several files and running the gate afterwards;
    # 30 minutes were consumed by dependency installation and the check alone.
    timeout-minutes: 60
    permissions:
      # Exchange an OIDC token for an OpenCode App token.
      id-token: write
      contents: read
      # Read the issue or pull request thread the agent answers to.
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The App token authenticates git; keep GITHUB_TOKEN out of .git/config.
          persist-credentials: false

      # Same pinned toolchain as CI, so the agent can run `mise run check`
      # before it pushes.
      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependencies and git hooks up front. Without this step the agent spends
      # its budget on `mise run deps` and `hk install` instead of the task.
      - name: Install dependencies and hooks
        run: mise run setup

      - name: Run OpenCode
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4.1-flash
          # Public repository: do not publish the session on opencode.ai.
          share: false

  implement:
    name: Implement spec
    needs: route
    # The routing job names the skill. `agent-code` serialises implement runs only:
    # the generic `Agent` job keeps its own per-issue group, so `/oc` in another
    # issue can run in parallel and edit the same files.
    if: needs.route.outputs.skill == 'implement-spec'
    runs-on: ubuntu-latest
    # Three tickets, worktrees, the full gate per ticket and a review pass.
    timeout-minutes: 180
    permissions:
      # Exchange an OIDC token for an OpenCode App token: the agent pushes with the
      # app token, so the created pull request triggers CI and the review chain.
      id-token: write
      contents: read
      # Read the issue thread the agent answers to.
      issues: read
      pull-requests: read
    concurrency:
      # One code-writing run at a time, never cancelled mid-push.
      group: agent-code
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ticket branches are merged into an integration branch locally.
          fetch-depth: 0
          # The push step and the app token handle writes; keep credentials out of
          # .git/config.
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependencies and git hooks up front: commit-msg and pre-push must work for
      # every commit the agent makes.
      - name: Install dependencies and hooks
        run: mise run setup

      # The CLI snapshots the workspace before it starts and in
      # `use_github_token` mode does not configure an identity itself.
      - name: Configure Git identity
        run: |
          git config --global user.name "opencode-agent"
          git config --global user.email "opencode-agent@users.noreply.github.com"

      # Browser tickets must be runnable by the implementer, not only by CI.
      - name: Install Chromium for Playwright
        run: mise exec -- pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run OpenCode
        timeout-minutes: 155
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Read-only `GITHUB_TOKEN`: enough for `gh issue view` on the spec and
          # the tickets. Pushes use the app token supplied by the action, and the
          # publishing token is never exposed to the model.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash
          # Public repository: do not publish the session on opencode.ai.
          share: false
          prompt: |
            Ты выполняешь скилл `implement-spec`: реализуй согласованную
            спецификацию и её тикеты. Загрузи скилл по ID `implement-spec` и следуй
            его процессу. Источник истины — `AGENTS.md`, `docs/adr/` и ссылки в
            этом issue.

            Ограничения и ожидания:
            - Прочитай обращение, спецификацию и тикеты через `gh issue view`.
              Тикеты — граф: начинай с тех, у кого нет открытых блокеров.
            - Воркдеревья и заметки — только в `.scratch/`; `/tmp` и пути вне
              репозитория запрещены конфигурацией.
            - Контракт первичен: сначала `contract/main.tsp`, затем
              `mise run contract:build`; сгенерированное руками не правь.
            - Перед коммитом в каждом тикете — `mise run check`; для браузерного
              тикета дополнительно `mise run e2e`.
            - После каждого готового тикета делай коммит и пуш, чтобы работа не
              терялась при таймауте. Коммиты — Conventional со ссылкой на тикет.
            - Не правь `.github/workflows/*`: у токена нет на это прав.
            - PR сам не создавай. В конце положи в `.scratch/pr-body.md` тело по
              `.github/pull_request_template.md` (все разделы с фактурой: команды,
              SHA = `git rev-parse HEAD`, ссылка на этот прогон
              `$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID`),
              а в `.scratch/pr-title.txt` — заголовок Conventional со ссылкой на
              спецификацию. В теле укажи `Closes` для тикетов и `Part of` для
              обращения.

      # The model never holds a write token: publishing happens here, with the
      # repository secret, and only after the agent has committed its work.
      - name: Publish pull request
        if: always()
        timeout-minutes: 10
        env:
          # Both names on purpose: the action leaves a git credential helper that
          # reads GITHUB_TOKEN, and `gh` reads GH_TOKEN. With only one set, git
          # presents an empty password and GitHub answers "Invalid username or token".
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AGENT_TOKEN }}
          BASE: main
        run: |
          set -euo pipefail
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" = "main" ] || [ "$branch" = "HEAD" ]; then
            echo "::warning::Агент не оставил ветки с работой — PR не создаётся"
            exit 1
          fi

          # The publishing token can edit workflow files, but the agent must not
          # land changes to them through it: such edits are a human's job in a
          # normal pull request, where CI and review can see them.
          if git diff --name-only "origin/$BASE...HEAD" -- .github/workflows | grep -q .; then
            echo "::error::Ветка меняет .github/workflows/*: такие правки выносятся отдельным PR человеком"
            exit 1
          fi

          # `gh` supplies git credentials from GH_TOKEN at call time: the token
          # never lands in .git/config. A hand-written helper must name the token
          # owner as the user — fine-grained tokens reject `x-access-token`.
          gh auth setup-git

          # The body is the contract of the pull request: without it neither path
          # may publish, otherwise a green step would leave a PR outside the
          # template.
          if [ ! -s .scratch/pr-body.md ]; then
            echo "::error::Агент не оставил .scratch/pr-body.md — PR без тела по шаблону не создаём"
            exit 1
          fi
          # An empty file must not shadow the commit subject: the title is part of
          # the same contract as the body.
          if [ -s .scratch/pr-title.txt ]; then
            title=$(cat .scratch/pr-title.txt)
          else
            title=$(git log -1 --pretty=%s)
          fi

          # A closed pull request still resolves by branch name: treat only an open
          # one as existing, otherwise a rerun would edit the closed thread.
          state=$(gh pr view "$branch" --json state --jq .state 2>/dev/null || true)

          if [ "$state" = "OPEN" ]; then
            # The agent's CLI pushes the branch and opens a draft pull request whose
            # title is the model's last message: bring title and body in line with
            # the template before CI and the reviewer read them.
            git fetch origin "$branch"
            if git merge-base --is-ancestor "origin/$branch" HEAD; then
              git push origin "$branch"
              gh pr edit "$branch" --title "$title" --body-file .scratch/pr-body.md
            else
              # Local history diverged from the pushed branch: publish separately
              # instead of failing on a non-fast-forward.
              branch="$branch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
              git checkout -b "$branch"
              state=""
            fi
          fi

          if [ "$state" != "OPEN" ]; then
            # A rerun may reuse a branch name left by a failed attempt: pushing to
            # it would fail on a non-fast-forward, so publish to a fresh name and
            # keep the previous attempt intact. `RUN_ATTEMPT` grows on every rerun
            # of the same run, so two reruns of one workflow run do not collide.
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              branch="$branch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
              git checkout -b "$branch"
            fi
            git push -u origin "$branch"
            gh pr create --draft --base "$BASE" --head "$branch" \
              --title "$title" --body-file .scratch/pr-body.md
          fi

          # Prove the chain started instead of trusting it.
          gh run list --branch "$branch" --limit 5 \
            --json workflowName,status,headSha \
            --jq '.[] | "\(.workflowName): \(.status) @ \(.headSha)"'

  skill:
    name: Skill
    needs: route
    if: |
      needs.route.outputs.skill != '' &&
      needs.route.outputs.skill != 'implement-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash
          share: false
          use_github_token: true
