name: OpenCode

# Run the agent from a comment: `/oc <task>` or `/opencode <task>`.
#
# Three comment surfaces, routed by the `route` job:
# - an issue comment naming an issue-tracker skill (`to-spec`, `to-tickets`,
#   `triage`) runs with issues: write; `implement-spec` gets its own long job;
#   any other issue comment goes to the read-only generic agent;
# - a comment in a pull request conversation edits the PR head branch;
# - a comment on a diff line edits the same branch, and the action adds the
#   file, line and diff hunk to the prompt.
# Tracker skills are parsed only for issue comments, so a PR comment can never
# start triage, to-spec, to-tickets or implement-spec.
# https://opencode.ai/docs/github/

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Start from nothing: the job grants only what the agent needs.
permissions: {}

concurrency:
  # One agent per issue or pull request. New instructions must not cancel a run
  # that is already pushing commits.
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  route:
    name: Route
    if: |
      github.event.comment.author_association == 'OWNER' &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.parse.outputs.kind }}
      skill: ${{ steps.parse.outputs.skill }}
    steps:
      - name: Parse comment kind and skill
        id: parse
        env:
          EVENT: ${{ github.event_name }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT" = "pull_request_review_comment" ]; then
            kind="pr_line"
          elif [ "$EVENT" = "issue_comment" ] && [ "$IS_PR" = "true" ]; then
            kind="pr"
          elif [ "$EVENT" = "issue_comment" ]; then
            kind="issue"
          else
            kind="other"
          fi

          # Tracker skills exist only on ordinary issues: a pull request comment
          # is a code fix, so it must not reach triage, to-spec or to-tickets.
          skill=""
          if [ "$kind" = "issue" ]; then
            skill=$(printf '%s\n' "$BODY" \
              | grep -oiE '(скил[^[:space:]]*|skill)[[:space:]]*:?[[:space:]]*@?(to-spec|to-tickets|triage|implement-spec)|/(oc|opencode)[[:space:]]+@?(to-spec|to-tickets|triage|implement-spec)' \
              | head -n1 \
              | grep -oiE '(to-spec|to-tickets|triage|implement-spec)' \
              | tr '[:upper:]' '[:lower:]')
          fi

          {
            echo "kind=$kind"
            echo "skill=$skill"
          } >> "$GITHUB_OUTPUT"

  opencode:
    name: Agent
    needs: route
    # Ordinary issue comments only: the owner and `/oc` checks live in `route`,
    # and pull request comments have their own `pr` job below.
    if: needs.route.outputs.kind == 'issue' && needs.route.outputs.skill == ''
    runs-on: ubuntu-latest
    # Infra work means writing several files and running the gate afterwards;
    # 30 minutes were consumed by dependency installation and the check alone.
    timeout-minutes: 60
    permissions:
      # Exchange an OIDC token for an OpenCode App token.
      id-token: write
      contents: read
      # Read the issue or pull request thread the agent answers to.
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The App token authenticates git; keep GITHUB_TOKEN out of .git/config.
          persist-credentials: false

      # Same pinned toolchain as CI, so the agent can run `mise run check`
      # before it pushes.
      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependencies and git hooks up front. Without this step the agent spends
      # its budget on `mise run deps` and `hk install` instead of the task.
      - name: Install dependencies and hooks
        run: mise run setup

      - name: Run OpenCode
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Enough for `gh issue view` and `gh pr view` inside the run.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash
          # Public repository: do not publish the session on opencode.ai.
          share: false

  pr:
    name: PR ${{ needs.route.outputs.kind == 'pr_line' && 'line fix' || 'fix' }}
    needs: route
    # Both pull request comment surfaces end up here: the conversation and a
    # diff line. The action checks out the PR head and pushes the same branch,
    # so an edit never forks a second branch or pull request.
    if: needs.route.outputs.kind == 'pr' || needs.route.outputs.kind == 'pr_line'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # OIDC -> OpenCode App token. The App has contents: write and performs the
      # push; GITHUB_TOKEN stays read-only on purpose. A push by GITHUB_TOKEN
      # would not start CI or the review, and a broad token buys nothing here.
      id-token: write
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      # Same gate as `implement`: code-writing runs never overlap.
      group: agent-code
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The App token authenticates git; keep GITHUB_TOKEN out of .git/config.
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hooks up front: the agent's own commit and push must run them.
      - name: Install dependencies and hooks
        run: mise run setup

      - name: Configure Git identity
        run: |
          git config --global user.name "opencode-agent"
          git config --global user.email "opencode-agent@users.noreply.github.com"

      - name: Install Chromium for Playwright
        run: mise exec -- pnpm --dir frontend exec playwright install --with-deps chromium

      # No `prompt` on purpose: the comment body is the task, and for a review
      # comment the action appends the file, line and diff hunk. A prompt
      # override would drop that context.
      - name: Run OpenCode
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash
          # Public repository: do not publish the session on opencode.ai.
          share: false

  implement:
    name: Implement spec
    needs: route
    # The routing job names the skill. `agent-code` serialises this job and the
    # `pr` fix job: code-writing runs never overlap, not even on different PRs.
    if: needs.route.outputs.kind == 'issue' && needs.route.outputs.skill == 'implement-spec'
    runs-on: ubuntu-latest
    # Three tickets, worktrees, the full gate per ticket and a review pass.
    timeout-minutes: 180
    permissions:
      # Exchange an OIDC token for an OpenCode App token: the agent pushes with the
      # app token, so the created pull request triggers CI and the review chain.
      id-token: write
      # The publishing step creates the pull request and fixes its title and body.
      # Events from GITHUB_TOKEN do not start workflows, so publishing never
      # pretends to trigger CI; the push and the PR opening already did.
      contents: write
      issues: write
      pull-requests: write
      # Re-running the gate after the title fix needs Actions write.
      actions: write
    concurrency:
      # One code-writing run at a time, never cancelled mid-push.
      group: agent-code
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ticket branches are merged into an integration branch locally.
          fetch-depth: 0
          # The push step and the app token handle writes; keep credentials out of
          # .git/config.
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependencies and git hooks up front: commit-msg and pre-push must work for
      # every commit the agent makes.
      - name: Install dependencies and hooks
        run: mise run setup

      # The CLI snapshots the workspace before it starts and in
      # `use_github_token` mode does not configure an identity itself.
      - name: Configure Git identity
        run: |
          git config --global user.name "opencode-agent"
          git config --global user.email "opencode-agent@users.noreply.github.com"

      # Browser tickets must be runnable by the implementer, not only by CI.
      - name: Install Chromium for Playwright
        run: mise exec -- pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run OpenCode
        timeout-minutes: 155
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Read-only `GITHUB_TOKEN`: enough for `gh issue view` on the spec and
          # the tickets. Pushes use the app token supplied by the action, and the
          # publishing token is never exposed to the model.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash
          # Public repository: do not publish the session on opencode.ai.
          share: false
          prompt: |
            Ты выполняешь скилл `implement-spec`: реализуй согласованную
            спецификацию и её тикеты. Загрузи скилл по ID `implement-spec` и следуй
            его процессу. Источник истины — `AGENTS.md`, `docs/adr/` и ссылки в
            этом issue.

            Ограничения и ожидания:
            - Прочитай обращение, спецификацию и тикеты через `gh issue view`.
              Тикеты — граф: начинай с тех, у кого нет открытых блокеров.
            - Воркдеревья и заметки — только в `.scratch/`; `/tmp` и пути вне
              репозитория запрещены конфигурацией.
            - Контракт первичен: сначала `contract/main.tsp`, затем
              `mise run contract:build`; сгенерированное руками не правь.
            - Перед коммитом в каждом тикете — `mise run check`; для браузерного
              тикета дополнительно `mise run e2e`.
            - После каждого готового тикета делай коммит и пуш, чтобы работа не
              терялась при таймауте. Коммиты — Conventional со ссылкой на тикет.
            - Не правь `.github/workflows/*`: у токена нет на это прав.
            - Финальное сообщение — ровно заголовок PR в формате Conventional со
              ссылкой на тикет, без другого текста: CLI берёт его как заголовок
              открываемого PR.
            - PR сам не создавай. В конце положи в `.scratch/pr-body.md` тело по
              `.github/pull_request_template.md` (все разделы с фактурой: команды,
              SHA = `git rev-parse HEAD`, ссылка на этот прогон
              `$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID`),
              а в `.scratch/pr-title.txt` — заголовок Conventional со ссылкой на
              спецификацию. В теле укажи `Closes` для тикетов и `Part of` для
              обращения.

      # The model never holds a write token: publishing happens here, with the
      # repository secret, and only after the agent has committed its work.
      - name: Publish pull request
        if: always()
        timeout-minutes: 10
        env:
          # Both names on purpose: the action leaves a git credential helper that
          # reads GITHUB_TOKEN, and `gh` reads GH_TOKEN. The default token now
          # carries the write permissions granted above, so no PAT is involved.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: main
        run: |
          set -euo pipefail
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" = "main" ] || [ "$branch" = "HEAD" ]; then
            echo "::warning::Агент не оставил ветки с работой — PR не создаётся"
            exit 1
          fi

          # The publishing token can edit workflow files, but the agent must not
          # land changes to them through it: such edits are a human's job in a
          # normal pull request, where CI and review can see them.
          if git diff --name-only "origin/$BASE...HEAD" -- .github/workflows | grep -q .; then
            echo "::error::Ветка меняет .github/workflows/*: такие правки выносятся отдельным PR человеком"
            exit 1
          fi

          # Publishing talks to the API only: git credentials in this step are
          # controlled by the action's own helper and have caused nothing but 401s.
          # The agent pushes the branch itself with the app token.
          head_sha=$(git rev-parse HEAD)
          # A missing branch (HTTP 404) is a normal case; any other failure must be
          # reported as itself, not disguised as "no branch on remote".
          if ! out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha 2>&1); then
            case "$out" in
              *"HTTP 404"*) remote_sha="" ;;
              *)
                echo "::error::Не удалось проверить ветку через API: $out"
                exit 1
                ;;
            esac
          else
            remote_sha="$out"
          fi
          if [ "$remote_sha" != "$head_sha" ]; then
            echo "::error::Ветка $branch на remote не содержит head ($head_sha, на remote ${remote_sha:-нет}). Агент должен запушить ветку сам."
            exit 1
          fi

          # The body is the contract of the pull request: without it neither path
          # may publish, otherwise a green step would leave a PR outside the
          # template.
          if [ ! -s .scratch/pr-body.md ]; then
            echo "::error::Агент не оставил .scratch/pr-body.md — PR без тела по шаблону не создаём"
            exit 1
          fi
          # An empty file must not shadow the commit subject: the title is part of
          # the same contract as the body.
          if [ -s .scratch/pr-title.txt ]; then
            title=$(cat .scratch/pr-title.txt)
          else
            title=$(git log -1 --pretty=%s)
          fi

          # A closed pull request still resolves by branch name: treat only an open
          # one as existing, otherwise a rerun would edit the closed thread.
          state=$(gh pr view "$branch" --json state --jq .state 2>/dev/null || true)

          if [ "$state" = "OPEN" ]; then
            # The agent's CLI may have opened a draft pull request whose title is
            # the model's last message: bring title and body in line with the
            # template before a human reads them.
            gh pr edit "$branch" --title "$title" --body-file .scratch/pr-body.md
          else
            gh pr create --draft --base "$BASE" --head "$branch" \
              --title "$title" --body-file .scratch/pr-body.md
          fi

          # The CLI opened the pull request with the model's own title, so the gate
          # may have started before the title was corrected. Re-run its failed
          # attempts: the title lint now reads the current title from the API.
          for id in $(gh run list --branch "$branch" --status failure --limit 5 \
            --json databaseId --jq '.[].databaseId'); do
            gh run rerun "$id" --failed || true
          done

          # Prove the chain started instead of trusting it.
          gh run list --branch "$branch" --limit 5 \
            --json workflowName,status,headSha \
            --jq '.[] | "\(.workflowName): \(.status) @ \(.headSha)"'

  skill:
    name: Skill
    needs: route
    # Tracker skills stay on ordinary issues; `route` leaves `skill` empty for
    # every pull request comment.
    if: |
      needs.route.outputs.kind == 'issue' &&
      needs.route.outputs.skill != '' &&
      needs.route.outputs.skill != 'implement-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4.1-flash
          share: false
          use_github_token: true
