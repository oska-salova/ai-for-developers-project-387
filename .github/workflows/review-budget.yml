name: Review budget

# The counter for automatic reviews lives in the Actions history, not in a pull
# request comment: the agent token cannot rewrite that history. A review is
# allowed only while the number of previous gate runs that passed stays under
# the limit, and the review workflow is triggered by this gate through
# `workflow_run`, so it executes the version from the default branch.
#
# Limits of this approach, stated plainly:
# - it holds only while run history is preserved and this file is unchanged;
# - a repository admin can change the limit or the workflow;
# - every new pull request starts with a fresh budget, so the limit bounds one
#   review loop, not the total spend on an issue.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Start from nothing: the job grants only what it needs.
permissions: {}

concurrency:
  group: review-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  budget:
    name: Review budget
    # Drafts, forks, dependabot and infrastructure pull requests do not start a
    # review, so they must not spend a budget slot either.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-review')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      # The counter lives in the run history and is read-only here.
      actions: read
      contents: read
    steps:
      # A pull request that rewrites the gate must not grade itself: the
      # comparison is cheap and catches accidental edits. A deliberate rewrite
      # is out of scope for a `pull_request` trigger and needs a human.
      - name: Refuse when the gate itself was edited
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          path=.github/workflows/review-budget.yml
          base=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$BASE" --jq .sha)
          head=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$HEAD" --jq .sha)
          if [ "$base" != "$head" ]; then
            echo "::error::PR меняет воркфлоу бюджета ($path): вынесите правку в отдельный PR"
            exit 1
          fi

      - name: Count attempts in the run history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Repository variable, so the limit is a setting and not a commit.
          LIMIT: ${{ vars.REVIEW_RUN_LIMIT || '3' }}
        run: |
          set -euo pipefail
          # Only gate runs that passed are counted: refusals must not inflate the
          # number, and runs cancelled by a newer push never reached the model.
          used=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/review-budget.yml/runs?per_page=100" \
            --jq ".workflow_runs[]
                  | select(.id != $GITHUB_RUN_ID)
                  | select(.conclusion == \"success\")
                  | select([.pull_requests[]?.number] | index($PR))
                  | .run_attempt" \
            | awk '{ sum += $1 } END { print sum + 0 }')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          {
            echo "## Бюджет авторевью"
            echo
            echo "- Использовано попыток: $used из $LIMIT"
            echo "- SHA: \`$HEAD_SHA\`"
            echo "- Прогон: $run_url"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$used" -ge "$LIMIT" ]; then
            echo "::error::Лимит $LIMIT попыток авторевью на этот PR исчерпан (использовано $used). SHA $HEAD_SHA. Логи: $run_url"
            exit 1
          fi
