name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Security scans depend on external data, so they also run weekly.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The title lint reads the live pull request title, not the event payload.
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools pinned in mise.toml — the same ones used locally.
      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Cheap and independent of the code: fail on a non-Conventional PR title
      # before the heavy steps run. Only the title is checked, not `(#N)`.
      # The title is read from the API, not from the event payload: the publishing
      # step may have corrected it after this event was created, and a re-run must
      # see the current value.
      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        shell: bash # runs with pipefail, so a failed `gh` call cannot look green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR" --json title --jq .title | commitlint

      - name: Install dependencies
        run: mise run deps

      - name: Install Chromium for Playwright
        run: mise exec -- pnpm --dir frontend exec playwright install --with-deps chromium

      # One command for both locally and in CI: contract drift, SDK-only audit,
      # format, linters, types, knip, tests and the browser scenario.
      - name: Run verify
        run: mise run verify

      # The report alone cannot prove which commit it belongs to: the review and
      # the human need the exact head SHA next to the browser result.
      - name: Record the checked head
        if: always()
        run: |
          {
            echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > head-sha.txt

      # The browser report is evidence, so it is uploaded even when verify fails:
      # a red scenario is exactly the artifact worth opening.
      - name: Upload the browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            head-sha.txt
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # betterleaks scans the full history.
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: mise run deps

      - name: Run security scans
        run: mise run security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
