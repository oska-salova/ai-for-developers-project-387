name: Issue Triage

# New issues from trusted authors get an agent triage comment.
# https://opencode.ai/docs/github/#issues-triage-example

on:
  issues:
    types: [opened]

# Start from nothing: the job grants only what the agent needs.
permissions: {}

concurrency:
  # One triage per issue. Different issues may run in parallel; a repeated
  # event for the same issue must not duplicate the analysis.
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage
    # The repository is public. Only trusted authors may spend the API key and
    # drive the agent with a prompt-injected issue body.
    # `ready-for-agent` marks specs and tickets already prepared by the
    # to-spec/to-tickets skills: re-triaging them would duplicate work.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Exchange an OIDC token for an OpenCode App token.
      id-token: write
      contents: read
      # Read the issue thread the agent analyses.
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The App token authenticates git; keep GITHUB_TOKEN out of .git/config.
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4.1-flash
          # Public repository: do not publish the session on opencode.ai.
          share: false
          prompt: |
            Ты — триаж-агент проекта «Календарь звонков».

            Разбери новое issue, не меняя код:
            1. Прочитай тело issue и комментарии, AGENTS.md, GLOSSARY.md,
               docs/agents/issue-tracker.md и docs/agents/triage-labels.md.
            2. Проверь по коду, не реализовано ли уже запрошенное поведение;
               назови затронутую область.
            3. Определи категорию (bug или enhancement) и рекомендуемое состояние
               (needs-triage, needs-info, ready-for-agent, ready-for-human, wontfix).
               Обоснуй.
            4. Опиши основной, негативный и соседний сценарии и границы проверки.
            5. Если данных не хватает, задай не больше трёх конкретных вопросов автору.

            Запрещено: менять файлы, открывать PR, делать git push, вызывать gh,
            запускать mise, сборку и тесты.

            Опубликуй ровно один комментарий по шаблону:

            > *This was generated by AI during triage.*

            ## Разбор
            ...

            ## Сценарии
            - основной: ...
            - негативный: ...
            - соседний: ...

            ## Рекомендация
            - категория: ...
            - состояние: ...
            - почему: ...

            ## Вопросы
            ...
